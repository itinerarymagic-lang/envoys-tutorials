<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="sg" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="6" fill="#d9d9de"/></pattern>
    <pattern id="sb" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="6" fill="#2f4bd6"/></pattern>
    <pattern id="ag" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="12" height="12" rx="2" fill="#d9d9de"/></pattern>
    <pattern id="ab" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="12" height="12" rx="2" fill="#2f4bd6"/></pattern>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#ffffff" stroke="#e5e5e7"/>
  <text x="20" y="32" font-size="15" font-weight="700" fill="#1d1d1f">Cost Basis: who gets counted</text>
  <rect x="20" y="44" width="420" height="28" rx="14" fill="#eef2ff" stroke="#2f4bd6"/>
  <text x="230" y="63" font-size="12.5" font-weight="600" fill="#2f4bd6" text-anchor="middle">Quote version: 24 students + 2 faculty + 2 staff = 28 people</text>
  <!-- Per Group -->
  <rect x="20" y="86" width="173" height="206" rx="10" fill="#fafafa" stroke="#e0e0e4"/>
  <text x="34" y="112" font-size="15" font-weight="700" fill="#1d1d1f">Per Group</text>
  <text x="34" y="131" font-size="11.5" fill="#6e6e73">counts the whole group, once</text>
  <g transform="translate(35,143)">
    <rect width="126" height="54" fill="url(#sg)"/>
    <rect y="54" width="54" height="18" fill="url(#sg)"/>
    <rect x="54" y="54" width="72" height="18" fill="url(#ag)"/>
    <rect x="-3" y="-3" width="132" height="78" rx="10" fill="none" stroke="#2f4bd6" stroke-width="2"/>
    <text x="134" y="5" font-size="12" font-weight="700" fill="#2f4bd6">×1</text>
  </g>
  <text x="34" y="250" font-size="11.5" fill="#6e6e73">Private bus</text>
  <text x="34" y="272" font-size="14" font-weight="700" fill="#1d1d1f">$350 × 1 = $350</text>
  <!-- Per Person -->
  <rect x="202" y="86" width="173" height="206" rx="10" fill="#fafafa" stroke="#e0e0e4"/>
  <text x="216" y="112" font-size="15" font-weight="700" fill="#1d1d1f">Per Person</text>
  <text x="216" y="131" font-size="11.5" fill="#6e6e73">counts everyone (28)</text>
  <g transform="translate(217,143)">
    <rect width="126" height="54" fill="url(#sb)"/>
    <rect y="54" width="54" height="18" fill="url(#sb)"/>
    <rect x="54" y="54" width="72" height="18" fill="url(#ab)"/>
  </g>
  <text x="216" y="250" font-size="11.5" fill="#6e6e73">Hotel, one night</text>
  <text x="216" y="272" font-size="14" font-weight="700" fill="#1d1d1f">$60 × 28 = $1,680</text>
  <!-- Per Student -->
  <rect x="384" y="86" width="173" height="206" rx="10" fill="#fafafa" stroke="#e0e0e4"/>
  <text x="398" y="112" font-size="15" font-weight="700" fill="#1d1d1f">Per Student</text>
  <text x="398" y="131" font-size="11.5" fill="#6e6e73">counts students only (24)</text>
  <g transform="translate(399,143)">
    <rect width="126" height="54" fill="url(#sb)"/>
    <rect y="54" width="54" height="18" fill="url(#sb)"/>
    <rect x="54" y="54" width="72" height="18" fill="url(#ag)"/>
  </g>
  <text x="398" y="250" font-size="11.5" fill="#6e6e73">Zipline tour</text>
  <text x="398" y="272" font-size="14" font-weight="700" fill="#1d1d1f">$45 × 24 = $1,080</text>
  <!-- Per Adult -->
  <rect x="566" y="86" width="173" height="206" rx="10" fill="#fafafa" stroke="#e0e0e4"/>
  <text x="580" y="112" font-size="15" font-weight="700" fill="#1d1d1f">Per Adult</text>
  <text x="580" y="131" font-size="11.5" fill="#6e6e73">counts faculty + staff (4)</text>
  <g transform="translate(581,143)">
    <rect width="126" height="54" fill="url(#sg)"/>
    <rect y="54" width="54" height="18" fill="url(#sg)"/>
    <rect x="54" y="54" width="72" height="18" fill="url(#ab)"/>
  </g>
  <text x="580" y="250" font-size="11.5" fill="#6e6e73">Park entry, adult rate</text>
  <text x="580" y="272" font-size="14" font-weight="700" fill="#1d1d1f">$30 × 4 = $120</text>
  <circle cx="26" cy="310" r="5" fill="#8a8a8e"/>
  <text x="36" y="314" font-size="12" fill="#6e6e73">student</text>
  <rect x="92" y="305" width="10" height="10" rx="2" fill="#8a8a8e"/>
  <text x="108" y="314" font-size="12" fill="#6e6e73">adult (faculty or staff)</text>
  <circle cx="270" cy="310" r="5" fill="#2f4bd6"/>
  <text x="280" y="314" font-size="12" fill="#6e6e73">blue = counted in the cost</text>
</svg>
