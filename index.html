<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtable ENVOYS — Tutorials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header id="site-header">
      <h1 id="site-title">Loading…</h1>
      <p id="site-intro"></p>
    </header>
    <div id="sections"></div>
  </main>

  <script>
    fetch('content/manifest.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById('site-title').textContent = data.site.title;
        document.getElementById('site-intro').textContent = data.site.intro;
        document.title = data.site.title + ' — Tutorials';

        const container = document.getElementById('sections');
        data.sections.forEach(section => {
          const h2 = document.createElement('h2');
          h2.className = 'subheader';
          h2.textContent = section.name;
          container.appendChild(h2);

          const list = document.createElement('div');
          list.className = 'rows';

          const rows = section.rows || [];

          // A section marked "coming-soon" (or with no rows yet) shows a
          // plain, unclickable placeholder label instead of links.
          if (section.status === 'coming-soon' || rows.length === 0) {
            const label = document.createElement('div');
            label.className = 'row row-disabled';
            label.textContent = 'COMING SOON';
            list.appendChild(label);
          } else {
            rows.forEach(row => {
              const a = document.createElement('a');
              a.className = 'row';
              // A row can point at its own page via "href"; otherwise it opens
              // the standard tutorial page for its id.
              a.href = row.href || ('tutorial.html?id=' + encodeURIComponent(row.id));
              a.textContent = row.title;
              list.appendChild(a);
            });
          }

          container.appendChild(list);
        });
      })
      .catch(() => {
        document.getElementById('site-title').textContent = 'Could not load content';
        document.getElementById('site-intro').textContent = 'Check that content/manifest.json exists and is valid JSON.';
      });
  </script>
</body>
</html>
