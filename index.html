<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtable ENVOYS — Tutorials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header id="site-header">
      <h1 id="site-title">Loading…</h1>
      <p id="site-intro"></p>
    </header>
    <div id="sections"></div>
  </main>

  <script>
    fetch('content/manifest.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('site-title').textContent = data.site.title;
        document.getElementById('site-intro').textContent = data.site.intro;
        document.title = data.site.title + ' — Tutorials';

        const container = document.getElementById('sections');
        data.sections.forEach(section => {
          const h2 = document.createElement('h2');
          h2.className = 'subheader';
          h2.textContent = section.name;
          container.appendChild(h2);

          const list = document.createElement('div');
          list.className = 'rows';
          section.rows.forEach(row => {
            const a = document.createElement('a');
            a.className = 'row';
            a.href = 'tutorial.html?id=' + encodeURIComponent(row.id);
            a.textContent = row.title;
            list.appendChild(a);
          });
          container.appendChild(list);
        });
      })
      .catch(() => {
        document.getElementById('site-title').textContent = 'Could not load content';
        document.getElementById('site-intro').textContent = 'Check that content/manifest.json exists and is valid JSON.';
      });
  </script>
</body>
</html>
