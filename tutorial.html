<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <main class="container">
    <a class="back" href="index.html">&larr; All tutorials</a>
    <h1 id="tutorial-title">Loading…</h1>
    <div id="video-wrap"></div>
    <article id="doc" class="doc"></article>
  </main>

  <script>
    const id = new URLSearchParams(location.search).get('id');

    function embed(url) {
      return '<div class="video"><iframe src="' + url +
        '" frameborder="0" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>';
    }

    fetch('content/manifest.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        let found = null;
        data.sections.forEach(s => s.rows.forEach(row => {
          if (row.id === id) found = row;
        }));

        if (!found) {
          document.getElementById('tutorial-title').textContent = 'Tutorial not found';
          return;
        }

        document.getElementById('tutorial-title').textContent = found.title;
        document.title = found.title;

        const wrap = document.getElementById('video-wrap');

        // Build the list of videos. Supports either a single "video" string
        // or a "videos" array of strings / { label, url } objects.
        let clips = [];
        if (Array.isArray(found.videos)) {
          clips = found.videos.map(v => typeof v === 'string' ? { url: v } : v);
        } else if (found.video) {
          clips = [{ url: found.video }];
        }

        if (clips.length) {
          wrap.innerHTML = clips.map(clip => {
            const label = clip.label ? '<p class="video-label">' + clip.label + '</p>' : '';
            return label + embed(clip.url);
          }).join('');
        } else {
          wrap.innerHTML = '<p class="coming-soon">Video coming soon.</p>';
        }

        if (found.slides) {
          wrap.innerHTML += embed(found.slides);
        }

        return fetch('content/docs/' + id + '.md?v=' + Date.now())
          .then(r => r.ok ? r.text() : '')
          .then(md => {
            if (md) document.getElementById('doc').innerHTML = marked.parse(md, { breaks: true });
          });
      })
      .catch(() => {
        document.getElementById('tutorial-title').textContent = 'Could not load content';
      });
  </script>
</body>
</html>
